<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Loading</title>
</head>

<body>
    <!--Pantalla de Carga -->
    <div id="loader" class="loader">
        <section class="loading" role="status">
            <h2>Welcome to my website </h2>
        <span class="loading__author"> - Your friends at UFPSO </span>
        <span class="loading__anim" aria-hidden="true"></span>
        </section>
    </div>

    <!-- Contenido principal -->
     <div id="website" class="website" inert>
        <h1>Welcome to my website</h1>
          <header class="header">
            <nav class="navbar container">
                <a href="#home" class="logo">
                    UFPSO <span>.dev</span>
                </a>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#services">Services</a></li>
                </ul>
            </nav>
          </header>

        <main>
            <!-- Hero seccion -->
             <section id="home" class="hero">
                <div class="hero__content"> 
                    <span class="subtitle">
                        Learning web development
                    </span>
                    
                    <h1>
                        Build something amazing
                    </h1>

                    <p>
                        Welcome to my website! I'm excited to share my journey in learning web development.
                    </p>

                </div>
                <a href="#services" class="btn">
                    Learn More
                </a>
             </section>
        </main>

</body>


</html>
